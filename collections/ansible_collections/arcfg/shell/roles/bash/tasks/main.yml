---
# tasks file for "arcfg.shell.bash" role
- name: "Install dependencies"
  become: true
  community.general.pacman:
    name: "{{ bash_packages }}"
    extra_args: "--needed"

- name: "Copy the 'bash' helper"
  become: true
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    mode: "{{ item.mode if item.mode is defined else 'u=rw,g=r,o=r' }}"
  loop:
    - src: "etc/profile.d/00-bash.sh"
      dest: "/etc/profile.d/00-bash.sh"
      mode: "u=rw,g=r,o=r"

# NOTE: workaround to keep current role path
- name: "Set current role path"
  ansible.builtin.set_fact:
    bash_role_path: "{{ role_path }}"

- name: "Create a symbolic links to bash config dirs"
  ansible.builtin.include_role:
    name: "arcfg.internal.linkcfg"
  vars:
    linkcfg_items:
      - src: "{{ bash_role_path }}/files/home/user/.config/bash"
        dest: "{{ ansible_user_dir }}/.config/bash"
        mode: "u=rwx,g=rx,o=rx"

- name: "Apply the 'bash' config templates"
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    mode: "{{ item.mode if item.mode is defined else 'u=rw,g=r,o=r' }}"
  loop:
    - src: "home/user/.config/bash/config.j2"
      dest: "~/.config/bash/config"
      mode: "u=rw,g=r,o=r"
