---
# tasks file for "arcfg.shell.common" role
# NOTE: workaround to keep current role path
- name: "Set current role path"
  ansible.builtin.set_fact:
    common_role_path: "{{ role_path }}"

- name: "Create a symbolic links to common config dirs"
  ansible.builtin.include_role:
    name: "arcfg.internal.linkcfg"
  vars:
    linkcfg_items:
      - src: "{{ common_role_path }}/files/home/user/.config/profile.d"
        dest: "{{ ansible_user_dir }}/.config/profile.d"
        mode: "u=rwx,g=rx,o=rx"

- name: "Copy the 'common' helper"
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    mode: "{{ item.mode if item.mode is defined else 'u=rw,g=r,o=r' }}"
  loop:
    - src: "home/user/.profile"
      dest: "~/.profile"
      mode: "u=rw,g=r,o=r"
