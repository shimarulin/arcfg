---
# tasks file for "arcfg.shell.common" role
- name: "Copy the 'common' helper"
  become: true
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    mode: "{{ item.mode if item.mode is defined else 'u=rw,g=r,o=r' }}"
  loop:
    - src: "home/user/.profile"
      dest: "~/.profile"
      mode: "u=rw,g=r,o=r"

# NOTE: workaround to keep current role path
- name: "Set current role path"
  ansible.builtin.set_fact:
    common_role_path: "{{ role_path }}"

